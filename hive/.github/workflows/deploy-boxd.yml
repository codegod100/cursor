name: Deploy to hive.boxd.sh

# Deploy-on-push is handled by the boxd webhook on the hive VM
# (https://hooks.hive.boxd.sh/hooks/deploy) after setup-boxd.sh runs.
# This workflow only verifies the hook endpoint is reachable.

on:
  push:
    branches:
      - main
    paths:
      - 'hive/**'
  workflow_dispatch:

concurrency:
  group: deploy-hive-boxd
  cancel-in-progress: false

jobs:
  verify-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check hooks.hive.boxd.sh is up
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 \
            https://hooks.hive.boxd.sh/hooks/deploy || echo "000")
          echo "hooks.hive.boxd.sh/hooks/deploy → HTTP ${code}"
          case "$code" in
            200|404|405|401|403) echo "Deploy hook endpoint reachable." ;;
            000)
              echo "::warning::hive.boxd.sh not provisioned yet — run hive/scripts/setup-boxd.sh"
              exit 0
              ;;
            *)
              echo "::error::Unexpected status ${code} from deploy hook"
              exit 1
              ;;
          esac
