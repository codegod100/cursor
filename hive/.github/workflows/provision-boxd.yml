name: Provision hive.boxd.sh

on:
  workflow_dispatch:
    inputs:
      reuse:
        description: Reuse existing hive VM if present
        type: boolean
        default: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install boxd CLI
        run: curl -fsSL https://boxd.sh/downloads/install.sh | sh

      - name: Provision hive VM
        env:
          BOXD_TOKEN: ${{ secrets.BOXD_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_URL: https://github.com/codegod100/hive.git
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "${BOXD_TOKEN:-}" ]; then
            echo "::error::BOXD_TOKEN secret required — mint with: boxd auth keys create hive-ci"
            exit 1
          fi
          ARGS=()
          [ "${{ inputs.reuse }}" = "true" ] && ARGS+=(--reuse)
          cd hive
          bash scripts/setup-boxd.sh "${ARGS[@]}"

      - name: Verify hive.boxd.sh
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 3 https://hive.boxd.sh/api/health
