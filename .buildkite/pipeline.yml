# Radicle Garden → Buildkite → cursor-agent → patch
#
# Triggered by the Radicle Buildkite adapter on repo events. When BUILDKITE_COMMIT
# is the root commit of a new issue COB, cursor-agent implements a fix and opens
# a patch via the radicle MCP server (.cursor/mcp.json).
#
# Buildkite secrets required:
#   CURSOR_API_KEY — Cursor CLI / service account API key
#
# Optional env:
#   RADICLE_AGENT_MODEL    — cursor-agent model id
#   RADICLE_AGENT_TIMEOUT  — agent timeout in seconds (default 3600)
#   RADICLE_AGENT_DRY_RUN  — set to 1 to validate detection without running agent

env:
  GIT_TERMINAL_PROMPT: "0"

steps:
  - label: ":radicle: Issue → :cursor: agent → patch"
    key: radicle-issue-agent
    command: bash scripts/buildkite/run-issue-agent.sh
    timeout_in_minutes: 90
    env:
      CURSOR_API_KEY: ${CURSOR_API_KEY}

  - label: ":mag: Verify patch (optional)"
    key: verify-patch
    depends_on: radicle-issue-agent
    allow_dependency_failure: true
    command: |
      set -euo pipefail
      BRANCH="$(buildkite-agent meta-data get radicle_issue_branch 2>/dev/null || true)"
      if [[ -z "$BRANCH" ]]; then
        echo "No issue branch metadata — prior step likely skipped (not an issue event)."
        exit 0
      fi
      if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        echo "Branch $BRANCH exists."
        git log -1 --oneline "$BRANCH"
      else
        echo "Branch $BRANCH not found — agent may have declined or failed before branching."
        exit 0
      fi
      echo ""
      echo "Open patches:"
      rad patch list --open 2>/dev/null | sed -n '1,15p' || rad patch 2>/dev/null | sed -n '1,15p' || true
